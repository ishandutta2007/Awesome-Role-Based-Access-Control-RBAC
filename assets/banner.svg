ght="700" letter-spacing="1.5">ENTERPRISE ACCESS CONTROL</text><text x="600" y="185" fill="#fff" filter="url(#glowSubtle)" font-size="38" font-weight="800" letter-spacing="-.5">Awesome Role-Based Access Control</text><text x="600" y="222" fill="url(#textGrad)" font-size="19" font-weight="600" letter-spacing=".5">The Curated RBAC, Fine-Grained Authorization, ReBAC &amp; PAM Directory</text><g fill="#94a3b8" font-size="12" font-weight="500"><text x="0" y="0" transform="translate(600, 260)"><tspan fill="#38bdf8" font-weight="700">RBAC</tspan> • <tspan fill="#818cf8" font-weight="700">ABAC / ReBAC</tspan> • <tspan fill="#a855f7" font-weight="700">Google Zanzibar</tspan> • <tspan fill="#38bdf8" font-weight="700">Privileged Access (PAM)</tspan> • <tspan fill="#818cf8" font-weight="700">Identity Governance (IGA)</tspan></text></g><g transform="translate(600, 312)"><rect width="360" height="28" x="-180" y="-14" fill="#090d16" stroke="#1e293b" stroke-width="1" rx="14"/><circle cx="-160" cy="0" r="4" fill="#10b981"/><text x="-148" y="4" fill="#cbd5e1" font-size="11.5" font-weight="600" text-anchor="start">SaaS Market Leaders &amp; Production-Ready Open Source</text></g></g></svg>
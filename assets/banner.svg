<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card/Pill Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -15px); opacity: 0.65; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateShieldGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 250px; }
    .pill-1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 6s ease-in-out infinite; }
    .pill-3 { animation: floatPill1 7s ease-in-out infinite; }
    .circuit-line { stroke-dasharray: 8 6; animation: flowDash 3s linear infinite; }
    .circuit-line-fast { stroke-dasharray: 6 6; animation: flowDash 2s linear infinite; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Animated Glowing Atmosphere Orbs (Background layer) -->
  <circle class="orb-1" cx="240" cy="120" r="160" fill="#38bdf8" filter="url(#glow)" opacity="0.15" />
  <circle class="orb-2" cx="980" cy="220" r="180" fill="#6366f1" filter="url(#glow)" opacity="0.18" />
  <circle cx="600" cy="180" r="220" fill="#a855f7" filter="url(#glow)" opacity="0.08" />

  <!-- Dynamic Security Flow Network Lines (Behind Foreground Content) -->
  <g opacity="0.6">
    <path class="circuit-line" d="M 60 180 L 260 180 L 320 220 L 480 220" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="260" cy="180" r="4" fill="#38bdf8" filter="url(#glowSubtle)" />
    <circle cx="320" cy="220" r="4" fill="#818cf8" filter="url(#glowSubtle)" />

    <path class="circuit-line-fast" d="M 720 140 L 880 140 L 940 180 L 1140 180" fill="none" stroke="#818cf8" stroke-width="2" />
    <circle cx="880" cy="140" r="4" fill="#818cf8" filter="url(#glowSubtle)" />
    <circle cx="940" cy="180" r="4" fill="#c084fc" filter="url(#glowSubtle)" />

    <path class="circuit-line" d="M 150 60 L 220 110 L 320 110" fill="none" stroke="#0ea5e9" stroke-width="1.5" />
    <path class="circuit-line" d="M 880 250 L 980 250 L 1050 300" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Animated Floating Dynamic Badges/Pills on Sides (Non-obstructing) -->
  <!-- Left Pill: Policy Enforcement -->
  <g class="pill-1" filter="url(#cardShadow)">
    <rect x="70" y="70" width="165" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="89" cy="89" r="6" fill="#10b981" filter="url(#glowSubtle)" />
    <text x="104" y="94" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans" letter-spacing="0.5">Least Privilege</text>
  </g>

  <g class="pill-2" filter="url(#cardShadow)">
    <rect x="50" y="240" width="180" height="38" rx="19" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="69" cy="259" r="6" fill="#38bdf8" filter="url(#glowSubtle)" />
    <text x="84" y="264" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans" letter-spacing="0.5">Zanzibar &amp; ReBAC</text>
  </g>

  <!-- Right Pill: Zero Trust Architecture -->
  <g class="pill-3" filter="url(#cardShadow)">
    <rect x="965" y="70" width="165" height="38" rx="19" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="984" cy="89" r="6" fill="#a855f7" filter="url(#glowSubtle)" />
    <text x="999" y="94" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans" letter-spacing="0.5">Zero-Trust PAM</text>
  </g>

  <g class="pill-1" filter="url(#cardShadow)">
    <rect x="980" y="240" width="170" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="999" cy="259" r="6" fill="#10b981" filter="url(#glowSubtle)" />
    <text x="1014" y="264" fill="#e2e8f0" font-size="13" font-weight="600" class="font-sans" letter-spacing="0.5">IAM Governance</text>
  </g>

  <!-- Central Foreground Shield / Lock Graphic -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <!-- Outer Decorative Glow Ring -->
    <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="url(#shieldGrad)" stroke-width="2" filter="url(#glowSubtle)" />
    <!-- Modern Shield Icon -->
    <path d="M 0 -16 L 14 -10 C 14 6 7 17 0 21 C -7 17 -14 6 -14 -10 Z" fill="url(#shieldGrad)" opacity="0.9"/>
    <!-- Keyhole / Check mark inside shield -->
    <circle cx="0" cy="-2" r="3.5" fill="#0f172a" />
    <path d="M -1.8 -1 L 1.8 -1 L 2.8 7 L -2.8 7 Z" fill="#0f172a" />
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed in foreground with crisp contrast) -->
  <g text-anchor="middle" class="font-sans">
    <!-- Top Pill Category Header -->
    <rect x="475" y="115" width="250" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="600" y="132" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE ACCESS CONTROL</text>

    <!-- Main Title -->
    <text x="600" y="185" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#glowSubtle)">
      Awesome Role-Based Access Control
    </text>

    <!-- High-tech Subtitle with Gradient Fill -->
    <text x="600" y="222" fill="url(#textGrad)" font-size="19" font-weight="600" letter-spacing="0.5">
      The Curated RBAC, Fine-Grained Authorization, ReBAC &amp; PAM Directory
    </text>

    <!-- Feature Tags Row in Foreground -->
    <g transform="translate(600, 260)" font-size="12" font-weight="500" fill="#94a3b8">
      <text x="0" y="0">
        <tspan fill="#38bdf8" font-weight="700">RBAC</tspan> • 
        <tspan fill="#818cf8" font-weight="700">ABAC / ReBAC</tspan> • 
        <tspan fill="#a855f7" font-weight="700">Google Zanzibar</tspan> • 
        <tspan fill="#38bdf8" font-weight="700">Privileged Access (PAM)</tspan> • 
        <tspan fill="#818cf8" font-weight="700">Identity Governance (IGA)</tspan>
      </text>
    </g>

    <!-- Bottom Status / Quality Bar -->
    <g transform="translate(600, 312)">
      <rect x="-180" y="-14" width="360" height="28" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <circle cx="-160" cy="0" r="4" fill="#10b981" />
      <text x="-148" y="4" text-anchor="start" fill="#cbd5e1" font-size="11.5" font-weight="600">SaaS Market Leaders &amp; Production-Ready Open Source</text>
    </g>
  </g>
</svg>

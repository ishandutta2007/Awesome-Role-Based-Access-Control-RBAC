<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" preserveAspectRatio="xMidYMid meet" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#334155"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity=".3"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowSubtle" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(15px,-15px);opacity:.65}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes flowDash{0%{stroke-dashoffset:80}}@keyframes rotateShieldGlow{0%{transform:rotate(0deg)}}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 250px}.pill-1{animation:floatPill1 5s ease-in-out infinite}.pill-2{animation:floatPill2 6s ease-in-out infinite}.pill-3{animation:floatPill1 7s ease-in-out infinite}.circuit-line{stroke-dasharray:8 6;animation:flowDash 3s linear infinite}.circuit-line-fast{stroke-dasharray:6 6;animation:flowDash 2s linear infinite}.font-sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#grid)"/><circle cx="240" cy="120" r="160" fill="#38bdf8" class="orb-1" filter="url(#glow)" opacity=".15"/><circle cx="980" cy="220" r="180" fill="#6366f1" class="orb-2" filter="url(#glow)" opacity=".18"/><circle cx="600" cy="180" r="220" fill="#a855f7" filter="url(#glow)" opacity=".08"/><g opacity=".6"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 60 180 L 260 180 L 320 220 L 480 220" class="circuit-line"/><circle cx="260" cy="180" r="4" fill="#38bdf8" filter="url(#glowSubtle)"/><circle cx="320" cy="220" r="4" fill="#818cf8" filter="url(#glowSubtle)"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 720 140 L 880 140 L 940 180 L 1140 180" class="circuit-line-fast"/><circle cx="880" cy="140" r="4" fill="#818cf8" filter="url(#glowSubtle)"/><circle cx="940" cy="180" r="4" fill="#c084fc" filter="url(#glowSubtle)"/><path fill="none" stroke="#0ea5e9" stroke-width="1.5" d="M 150 60 L 220 110 L 320 110" class="circuit-line"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 880 250 L 980 250 L 1050 300" class="circuit-line"/></g><g class="pill-1" filter="url(#cardShadow)"><rect width="165" height="38" x="70" y="70" fill="#0f172a" stroke="#38bdf8" s